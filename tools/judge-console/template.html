<title>MY LIVE 성향 판정 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 왼쪽 사례 목록 + 오른쪽 판정 콘솔(판정 → 지표 표 → 타임테이블 → 진단) — 페스티벌 타임테이블 인쇄물의 격자를 테스트 도구로 */
:root {
  --bg: #f2f4f3;
  --surface: #ffffff;
  --sunk: #e8ecea;
  --ink: #16201c;
  --muted: #5a6964;
  --line: #d3dbd8;
  --accent: #1d5a8a;
  --special: #7a3d8e;
  --special-soft: #f1e6f4;
  --base: #1c6b63;
  --base-soft: #e0efed;
  --ok: #2c7a43;
  --ok-soft: #e2f1e6;
  --bad: #b2352d;
  --bad-soft: #f7e3e1;
  --warn: #9a640f;
  --warn-soft: #f6ecd9;
  --off: #87938f;
  --blk: #ffffff;
  --blk-line: #b9c4c0;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201e; --sunk: #0d1311; --ink: #e2eae7; --muted: #92a29d; --line: #2a3633;
    --accent: #7ab4e2; --special: #c993d9; --special-soft: #2e2135; --base: #5fc1b4; --base-soft: #17302d;
    --ok: #6cc489; --ok-soft: #173123; --bad: #ec7b70; --bad-soft: #3a1c1a; --warn: #e2ab52; --warn-soft: #36290f;
    --off: #6c7a76; --blk: #1e2826; --blk-line: #3a4845; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201e; --sunk: #0d1311; --ink: #e2eae7; --muted: #92a29d; --line: #2a3633;
  --accent: #7ab4e2; --special: #c993d9; --special-soft: #2e2135; --base: #5fc1b4; --base-soft: #17302d;
  --ok: #6cc489; --ok-soft: #173123; --bad: #ec7b70; --bad-soft: #3a1c1a; --warn: #e2ab52; --warn-soft: #36290f;
  --off: #6c7a76; --blk: #1e2826; --blk-line: #3a4845; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100%; }
aside { border-right: 1px solid var(--line); background: var(--surface); padding-block: 20px; padding-inline: 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-inline: 6px; margin-bottom: 14px; }
.brand b { font-size: 15px; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 12px; }
.suite { margin: 0 6px 16px; padding: 8px 10px; border-radius: var(--r); font-size: 13px; }
.suite.ok { background: var(--ok-soft); color: var(--ok); }
.suite.bad { background: var(--bad-soft); color: var(--bad); }
.grp { margin-bottom: 14px; }
.grp-h { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); padding: 0 6px 4px; }
.case { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 6px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r); padding: 6px; font-size: 13px; }
.case:hover { background: var(--sunk); }
.case.cur { background: var(--base-soft); }
.cid { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.ctitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font-size: 11px; padding: 1px 6px; border-radius: 99px; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.off { background: var(--sunk); color: var(--muted); }
.picker { display: none; }

main { padding-block: 24px 64px; padding-inline: 28px; min-width: 0; display: flex; flex-direction: column; gap: 28px; max-width: 1240px; }
h1 { font-size: 24px; line-height: 1.3; margin: 2px 0 6px; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 15px; margin: 0 0 10px; letter-spacing: -0.01em; }
.count { color: var(--muted); font-weight: 400; }
.eyebrow { font-size: 12px; color: var(--muted); }
.focus { margin: 0; max-width: 72ch; color: var(--ink); }
.modified, .notice { margin-top: 10px; padding: 8px 12px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 5px 12px; font-size: 13px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.ghost { background: transparent; }

.verdict { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--off); border-radius: var(--r); padding: 18px 20px; }
.verdict.special { border-left-color: var(--special); }
.verdict.base { border-left-color: var(--base); }
.v-label { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: var(--muted); }
.v-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.v-tier { font-size: 14px; font-weight: 500; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.v-artist { color: var(--special); font-weight: 500; }
.v-evidence { margin-top: 8px; font-size: 15px; }
.draft { margin-left: 8px; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; vertical-align: middle; }
.v-reason { margin-top: 10px; color: var(--muted); font-size: 13px; }
.ties { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.tie { border: 1px dashed var(--line); border-radius: 99px; padding: 1px 8px; color: var(--ink); }
.tie.win { border-style: solid; border-color: var(--ink); }
.v-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sb { background: var(--sunk); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.sb-row { display: grid; grid-template-columns: 90px auto 1fr; gap: 10px; align-items: center; font-size: 13px; }
.sb-k { color: var(--muted); }
.sb-rule { font-size: 11px; color: var(--muted); }
.expect { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.exp-row { display: flex; gap: 6px; }
.exp-row.ok .mark { color: var(--ok); font-weight: 700; }
.exp-row.bad { color: var(--bad); }
.exp-row.bad .mark { font-weight: 700; }

.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips i { width: 9px; height: 9px; border-radius: 2px; border: 1.5px solid var(--off); display: block; }
.pips.special i.on { background: var(--special); border-color: var(--special); }
.pips.base i.on { background: var(--base); border-color: var(--base); }
.pips.none i.on { background: var(--off); }

.blocked { background: var(--bad-soft); color: var(--bad); border-radius: var(--r); padding: 12px 16px; }
.blocked p { margin: 0; }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; }
.stat-v { font-size: 22px; font-weight: 500; }
.stat-k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); }
.stat-s { font-size: 11px; color: var(--muted); }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
thead th { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); background: var(--sunk); white-space: nowrap; }
tbody tr:last-child > * { border-bottom: 0; }
.num { text-align: right; }
table.metrics { min-width: 1240px; }
.metrics th[scope="row"] { white-space: nowrap; font-weight: 600; }
.metrics td.tier { white-space: nowrap; }
.metrics .t { margin-left: 6px; font-size: 12px; }
.metrics tr.is-rep { background: var(--base-soft); }
.metrics tr.dim > :not(th) { color: var(--muted); }
.metrics td.notes { min-width: 250px; }
.notes-in { display: flex; flex-direction: column; gap: 3px; }
.metrics td.ev { min-width: 200px; }
.metrics td:nth-child(3) { min-width: 150px; }
.metrics td:nth-child(4) { min-width: 180px; }
.metrics td:nth-child(5) { min-width: 170px; }
.why { color: var(--warn); }
.rule { font-size: 11px; color: var(--muted); }
.est-note { color: var(--muted); font-size: 12px; }
.tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 0 5px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; }
.tag.special { background: var(--special-soft); color: var(--special); }
.tag.base { background: var(--base-soft); color: var(--base); }
.tag.diag { background: var(--sunk); color: var(--muted); }
.tag.est { background: var(--warn-soft); color: var(--warn); }
.st { font-size: 12px; padding: 1px 6px; border-radius: 3px; }
.st.off { background: var(--sunk); color: var(--muted); }
.st.diag { background: var(--sunk); color: var(--muted); }
.legend { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
table.plain td:first-child { white-space: nowrap; }

.sec-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.sec-h h2 { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; font-size: 13px; }
.seg button.on { background: var(--ink); color: var(--bg); }
.hint { color: var(--muted); font-size: 12px; margin: 6px 0 10px; }

.grid { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px; }
.grid-h { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.grid-h .cnt { color: var(--muted); font-size: 12px; margin-left: auto; }
.grid-scroll { overflow-x: auto; }
.grid-in { min-width: 760px; padding: 6px 12px 10px; }
.g-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; }
.g-stage { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; line-height: 1.2; }
.g-stage em { font-style: normal; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; color: var(--base); }
.g-track { position: relative; height: 46px; border-top: 1px dashed var(--line); }
.g-track.thin { height: 24px; }
.axis .g-track { height: 18px; border-top: 0; }
.tick { position: absolute; top: 0; transform: translateX(-50%); font-size: 10px; color: var(--muted); }
.third { position: absolute; top: 0; bottom: 0; border-left: 1.5px dotted var(--warn); pointer-events: none; z-index: 1; }
.third-l { position: absolute; top: 0; transform: translateX(-50%); font-size: 9px; color: var(--warn); background: var(--surface); padding: 0 3px; z-index: 2; white-space: nowrap; }
.blk { position: absolute; top: 5px; bottom: 5px; border: 1px solid var(--blk-line); background: var(--blk); border-radius: 4px; padding: 2px 5px; text-align: left; overflow: hidden; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
.blk:hover { border-color: var(--accent); }
.blk .b-name { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .b-time { font-size: 9px; color: var(--muted); }
.blk.jp, .blk.fx { border-style: dashed; }
.blk.sel { background: var(--base); border-color: var(--base); color: #fff; }
.blk.sel .b-time { color: rgba(255,255,255,0.8); }
:root[data-theme="dark"] .blk.sel, :root[data-theme="dark"] .blk.sel .b-time { color: #0b1210; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .blk.sel, :root:not([data-theme="light"]) .blk.sel .b-time { color: #0b1210; } }
.blk.best { box-shadow: inset 0 0 0 2px var(--warn); }
.blk.last::after { content: "헤드"; position: absolute; right: 3px; top: 2px; font-size: 9px; font-weight: 600; color: var(--special); }
.blk.sel.last::after { color: inherit; }
.ov .g-stage { font-size: 11px; }
.seg-bar, .clu-bar { position: absolute; top: 4px; height: 16px; border-radius: 3px; font-size: 10px; display: flex; align-items: center; padding: 0 4px; overflow: hidden; white-space: nowrap; }
.seg-bar { background: var(--base-soft); border: 1px solid var(--base); color: var(--base); }
.clu-bar { background: var(--warn-soft); border: 1px solid var(--warn); color: var(--warn); }
.bnd { position: absolute; top: 3px; transform: translateX(-50%); font-family: var(--font-mono); font-size: 12px; font-weight: 600; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; }
.bnd.confirmed-move { background: var(--base); color: var(--surface); }
.bnd.confirmed-stay { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.bnd.uncertain { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
.none { position: absolute; top: 4px; font-size: 11px; color: var(--muted); }

.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.day-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin-bottom: 6px; }
dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 10px; margin: 0; font-size: 12px; }
dt { color: var(--muted); }
dd { margin: 0; }
.muted { color: var(--muted); }

details summary { cursor: pointer; color: var(--accent); font-size: 13px; padding: 6px 0; }
details .tbl-wrap { margin-top: 6px; }
.cfg summary { font-weight: 600; color: var(--ink); font-size: 15px; }

.tools textarea { width: 100%; min-height: 180px; font-family: var(--font-mono); font-size: 11px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; resize: vertical; }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.tool-msg { font-size: 12px; color: var(--muted); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { display: none; }
  .picker { display: flex; flex-direction: column; gap: 6px; padding-block: 14px 0; padding-inline: 16px; }
  .picker select { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); }
  main { padding-inline: 16px; gap: 22px; }
  .verdict { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats .stat:last-child { grid-column: span 2; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <aside>
    <div class="brand"><b>MY LIVE 성향 판정</b><span>판정 로직 v0.1.1 · 내부 테스트</span></div>
    <div id="suite" class="suite"></div>
    <nav id="case-list" aria-label="가상 사례"></nav>
  </aside>
  <div>
    <div class="picker">
      <div id="suite-m" class="muted" style="font-size:12px">판정 로직 v0.1.1 · 내부 테스트 (가상 데이터)</div>
      <label for="case-select" class="sr">사례 선택</label>
      <select id="case-select"></select>
    </div>
    <main id="main"></main>
  </div>
</div>
<script>
/*__APP__*/
</script>
